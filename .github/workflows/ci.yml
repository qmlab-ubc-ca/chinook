name: Chinook CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Chinook and test dependencies
        run: python -m pip install . pytest
      - name: Run pytest
        run: python -m pytest -q
      - name: Run graphene example
        run: python docs/source/downloads/graphene_front.py
      - name: Run square-lattice tutorial
        run: python docs/source/downloads/tutorial_square.py
